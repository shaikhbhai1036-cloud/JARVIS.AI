name: Build Jarvis APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project
        run: |
          echo "-" | base64 -d | tar xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd JarvisAI && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-APK
          path: JarvisAI/app/build/outputs/apk/debug/app-debug.apk
